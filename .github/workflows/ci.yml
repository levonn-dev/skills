name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # jq and shellcheck are preinstalled on ubuntu-latest runners.

      - name: Validate JSON
        run: |
          set -uo pipefail
          rc=0
          while IFS= read -r f; do
            if ! jq empty "$f" >/dev/null 2>&1; then
              echo "::error file=$f::invalid JSON"
              rc=1
            fi
          done < <(git ls-files '*.json')
          exit $rc

      - name: Hook test suites
        run: |
          set -euo pipefail
          bash plugins/git-safety/tests/run.sh
          bash plugins/docs-sync/tests/run.sh
          bash plugins/statusline/tests/run.sh
          bash plugins/statusline/tests/render.sh
          bash plugins/trim-output/tests/run.sh
          bash plugins/trim-output/tests/filter.sh
          bash plugins/delegation/tests/provider.sh
          bash plugins/delegation/tests/run.sh
          bash plugins/delegation/tests/log.sh
          bash plugins/delegation/tests/note.sh
          bash plugins/delegation/tests/config.sh
          bash plugins/delegation/tests/alias-map.sh
          bash plugins/delegation/tests/agents.sh

      - name: ShellCheck
        run: shellcheck plugins/*/hooks/*.sh plugins/*/tests/*.sh plugins/*/bin/*.sh

      - name: Marketplace integrity
        run: |
          set -uo pipefail
          rc=0
          # Every plugin listed in the marketplace must have a matching dir and a
          # plugin.json whose name and version agree with the marketplace entry.
          while IFS=$'\t' read -r name source version; do
            dir="${source#./}"
            if [ ! -d "$dir" ]; then
              echo "::error::marketplace plugin '$name': missing dir $dir"
              rc=1
              continue
            fi
            pj="$dir/.claude-plugin/plugin.json"
            if [ ! -f "$pj" ]; then
              echo "::error::marketplace plugin '$name': missing $pj"
              rc=1
              continue
            fi
            pj_name="$(jq -r '.name' "$pj")"
            if [ "$pj_name" != "$name" ]; then
              echo "::error::name mismatch: marketplace '$name' vs plugin.json '$pj_name'"
              rc=1
            fi
            pj_version="$(jq -r '.version' "$pj")"
            if [ "$pj_version" != "$version" ]; then
              echo "::error::version drift for '$name': marketplace '$version' vs plugin.json '$pj_version'"
              rc=1
            fi
          done < <(jq -r '.plugins[] | [.name, .source, .version] | @tsv' .claude-plugin/marketplace.json)
          exit $rc

  # Every plugin supports macOS as well as Linux. The hook suites run there
  # on the stock tools (bash 3.2, BSD utilities, Apple awk), and again with
  # Homebrew bash, which the runner image does not carry, installed first.
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        tools: [stock, homebrew]
    steps:
      - uses: actions/checkout@v7

      - name: Hook test suites
        run: |
          set -uo pipefail
          if [ "${{ matrix.tools }}" = stock ]; then
            export PATH="/bin:/usr/bin:$PATH"
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew install bash
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          bash --version | head -1
          # A job that is not running the bash its name claims proves nothing.
          major="$(bash -c 'echo "${BASH_VERSINFO[0]}"')"
          case "${{ matrix.tools }}:$major" in
            stock:3|homebrew:[5-9]) ;;
            *) echo "::error::the ${{ matrix.tools }} job is running bash $major"; exit 1 ;;
          esac
          rc=0
          for suite in plugins/*/tests/*.sh; do
            echo "::group::$suite"
            if ! out="$(bash "$suite" 2>&1)"; then
              rc=1
              # Failing checks as an annotation, readable without opening the log.
              echo "::error title=$suite::$(printf '%s\n' "$out" | grep -i 'fail' | tr '\n' ' ')"
            fi
            printf '%s\n' "$out"
            echo "::endgroup::"
          done
          exit $rc
